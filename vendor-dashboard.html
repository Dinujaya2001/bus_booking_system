<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusGo - Fleet Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="mb-5">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 mb-4">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">Vendor Fleet System</a>
        <div>
            <a href="index.html" class="btn btn-sm btn-outline-light">Switch to Customer View</a>
        </div>
    </div>
</nav>

<div class="container">
    <div id="vendorAlert"></div>

    <div class="card shadow-sm border-0 p-4 mb-4">
        <h5 class="mb-3">Create New Schedule</h5>
        <form id="vendorScheduleForm" class="row g-3">
            <div class="col-md-3">
                <label class="form-label text-muted small">Bus Label</label>
                <input type="text" id="vBusName" class="form-control" required placeholder="e.g. Super Line">
            </div>
            <div class="col-md-3">
                <label class="form-label text-muted small">Vehicle Number</label>
                <input type="text" id="vVehicleNo" class="form-control" required placeholder="e.g. WP NA-5421">
            </div>
            <div class="col-md-3">
                <label class="form-label text-muted small">Origin</label>
                <select id="vFrom" class="form-select" required></select>
            </div>
            <div class="col-md-3">
                <label class="form-label text-muted small">Destination</label>
                <select id="vTo" class="form-select" required></select>
            </div>
            <div class="col-md-3">
                <label class="form-label text-muted small">Departure Time</label>
                <input type="datetime-local" id="vDeparture" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label class="form-label text-muted small">Arrival Time</label>
                <input type="datetime-local" id="vArrival" class="form-control" required>
            </div>
            <div class="col-md-2">
                <label class="form-label text-muted small">Seat Price (Rs.)</label>
                <input type="number" id="vPrice" class="form-control" step="0.01" required>
            </div>
            <div class="col-md-2">
                <label class="form-label text-muted small">Capacity</label>
                <input type="number" id="vSeats" class="form-control" value="40" required>
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button type="submit" id="btnSaveSchedule" class="btn btn-primary w-100">Add Schedule</button>
            </div>
        </form>
    </div>

    <div class="card shadow-sm border-0 p-3">
        <h6 class="mb-3">Configured Schedules</h6>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Bus</th>
                        <th>Vehicle No</th>
                        <th>Route</th>
                        <th>Departure</th>
                        <th>Price</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tblVendorSchedules">
                    <tr><td colspan="6" class="text-center text-muted">Loading schedules...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/vendor.js"></script>
</body>
</html>

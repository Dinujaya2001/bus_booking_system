<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bus Booking - My Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary px-4 mb-4">
    <a class="navbar-brand fw-bold" href="index.html">BusGo</a>
    <div class="ms-auto">
        <a href="index.html" class="btn btn-sm btn-outline-light">Book More</a>
    </div>
</nav>

<div class="container">
    <div id="bookingListAlert"></div>
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white">
            <h5 class="mb-0">Booking Records</h5>
        </div>
        <div class="table-responsive p-3">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Booking ID</th>
                        <th>Date</th>
                        <th>Schedule</th>
                        <th>Seats</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="bookingTableBody">
                    <tr><td colspan="5" class="text-center text-muted">Loading reservations...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    checkAuth();
    loadBookings();
});

async function loadBookings() {
    const user = checkAuth();
    // Fetch all bookings for customer / vendor[cite: 1]
    const res = await apiGet(`/BusBooking/GetAllBusBookings?vendorId=1`);
    const tbody = document.getElementById('bookingTableBody');

    if (res.result && Array.isArray(res.data) && res.data.length > 0) {
        tbody.innerHTML = res.data.map(b => `
            <tr>
                <td>#${b.bookingId}</td>
                <td>${new Date(b.bookingDate).toLocaleDateString()}</td>
                <td>Schedule #${b.scheduleId}</td>
                <td>${b.busBookingPassengers?.map(p => p.seatNo).join(', ') || 'N/A'}</td>
                <td>
                    <button class="btn btn-sm btn-outline-danger" onclick="cancelBooking(${b.bookingId})">Cancel</button>
                </td>
            </tr>
        `).join('');
    } else {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">No reservations found.</td></tr>`;
    }
}

async function cancelBooking(id) {
    if (!confirm(`Are you sure you want to cancel booking #${id}?`)) return;
    const res = await apiDelete(`/BusBooking/DeleteBusBooking?id=${id}`);
    if (res.result) {
        showAlert('bookingListAlert', 'success', 'Booking cancelled successfully.');
        loadBookings();
    } else {
        showAlert('bookingListAlert', 'danger', res.message || 'Failed to cancel.');
    }
}
</script>
</body>
</html>

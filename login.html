<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Booking - Authentication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center min-vh-100 py-4">
<div class="container" style="max-width: 460px;">
    <div id="alertBox"></div>
    <div class="card shadow border-0">
        <div class="card-body p-4">
            <ul class="nav nav-pills nav-justified mb-4" id="authTabs" role="tablist">
                <li class="nav-item">
                    <button class="nav-link active" id="pills-login-tab" data-bs-toggle="pill" data-bs-target="#loginTab" type="button">Login</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" id="pills-register-tab" data-bs-toggle="pill" data-bs-target="#regTab" type="button">Register</button>
                </li>
            </ul>

            <div class="tab-content">
                <!-- Login -->
                <div class="tab-pane fade show active" id="loginTab">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label text-muted small">Username or Email</label>
                            <input type="text" id="loginUsername" class="form-control" required placeholder="Enter username / email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Password</label>
                            <input type="password" id="loginPassword" class="form-control" required placeholder="Enter password">
                        </div>
                        <button type="submit" id="btnLogin" class="btn btn-primary w-100 py-2">Sign In</button>
                    </form>
                </div>

                <!-- Registration -->
                <div class="tab-pane fade" id="regTab">
                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label text-muted small">Full Name</label>
                            <input type="text" id="regName" class="form-control" required placeholder="Your full name">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Email</label>
                            <input type="email" id="regEmail" class="form-control" required placeholder="name@example.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Password</label>
                            <input type="password" id="regPassword" class="form-control" required placeholder="Create password">
                        </div>
                        <button type="submit" id="btnRegister" class="btn btn-success w-100 py-2">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>

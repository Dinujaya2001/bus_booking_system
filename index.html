<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bus Booking - Find Schedules</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary px-4 mb-4">
    <a class="navbar-brand fw-bold" href="#">BusGo</a>
    <div class="ms-auto d-flex align-items-center gap-3">
        <a href="my-bookings.html" class="btn btn-sm btn-outline-light">My Bookings</a>
        <a href="vendor-dashboard.html" class="btn btn-sm btn-warning">Vendor Panel</a>
        <button onclick="logout()" class="btn btn-sm btn-danger">Logout</button>
    </div>
</nav>

<div class="container">
    <div class="card shadow-sm border-0 mb-4 p-4">
        <h4 class="mb-3">Search Available Buses</h4>
        <form id="searchForm" class="row g-3">
            <div class="col-md-4">
                <label class="form-label">From</label>
                <select id="fromLoc" class="form-select" required>
                    <option value="" disabled selected>Select Origin</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">To</label>
                <select id="toLoc" class="form-select" required>
                    <option value="" disabled selected>Select Destination</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Date</label>
                <input type="date" id="travelDate" class="form-control" required>
            </div>
            <div class="col-md-1 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100">Find</button>
            </div>
        </form>
    </div>

    <div id="resultsContainer"></div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/search.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Booking - Schedule Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary px-4 mb-4">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="index.html">BusGo Portal</a>
        <div class="d-flex align-items-center gap-2">
            <a href="my-bookings.html" class="btn btn-sm btn-outline-light">My Bookings</a>
            <a href="vendor-dashboard.html" class="btn btn-sm btn-warning">Vendor Admin</a>
            <button onclick="logout()" class="btn btn-sm btn-light">Logout</button>
        </div>
    </div>
</nav>

<div class="container">
    <div id="searchAlert"></div>
    <div class="card shadow-sm border-0 mb-4 p-4">
        <h5 class="mb-3">Search Bus Routes</h5>
        <form id="searchForm" class="row g-3">
            <div class="col-md-4">
                <label class="form-label text-muted small">Origin</label>
                <select id="fromLoc" class="form-select" required>
                    <option value="" disabled selected>Loading locations...</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label text-muted small">Destination</label>
                <select id="toLoc" class="form-select" required>
                    <option value="" disabled selected>Loading locations...</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label text-muted small">Date of Travel</label>
                <input type="date" id="travelDate" class="form-control" required>
            </div>
            <div class="col-md-1 d-flex align-items-end">
                <button type="submit" id="btnSearch" class="btn btn-primary w-100">Find</button>
            </div>
        </form>
    </div>

    <div id="resultsContainer"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/search.js"></script>
</body>
</html>

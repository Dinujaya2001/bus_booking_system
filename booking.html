<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bus Booking - Seat Selection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container py-4">
    <a href="index.html" class="btn btn-outline-secondary mb-3">&larr; Back to Schedules</a>
    <div id="bookingAlert"></div>

    <div class="row">
        <!-- Seat Map View -->
        <div class="col-md-5">
            <div class="card shadow-sm border-0 p-3 text-center">
                <h5 class="mb-3">Select Your Seats</h5>
                <div class="seat-legend mb-3 small">
                    <span class="bg-light border"></span> Available
                    <span class="bg-primary ms-2"></span> Selected
                    <span class="bg-danger ms-2"></span> Booked
                </div>
                <div id="seatGrid" class="seat-grid mb-3"></div>
            </div>
        </div>

        <!-- Passenger Details & Confirmation -->
        <div class="col-md-7">
            <div class="card shadow-sm border-0 p-4">
                <h5>Passenger Details</h5>
                <p class="text-muted small" id="selectionSummary">Select a seat to add passenger info</p>
                <form id="bookingForm">
                    <div id="passengerFields"></div>
                    <div class="border-top pt-3 mt-3 d-none" id="checkoutSection">
                        <div class="d-flex justify-content-between mb-3">
                            <span class="h5">Total Price:</span>
                            <span class="h5 text-success" id="totalPrice">Rs. 0.00</span>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Confirm & Book</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/booking.js"></script>
</body>
</html>
